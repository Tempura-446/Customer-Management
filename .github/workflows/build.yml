name: Build

# The repository is public, so GitHub Actions minutes are free: every push runs the tests and
# builds every platform. The same checks can also run locally: app/tool/check.ps1 (Windows) or
# app/tool/check.sh (macOS / Linux).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag, e.g. v1.0.0 (leave empty for a test build)"
        required: false
        default: ""
      phone_apps:
        description: "Build the Android and iPhone apps too (untick for the Windows installer only)"
        type: boolean
        required: false
        default: true

env:
  FLUTTER_VERSION: "3.47.9"
  # Release tag: a pushed v* tag, or the tag typed when starting the workflow by hand.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

# A newer push to the same branch cancels the older push build (saves runner minutes).
# Releases started by hand are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle Visual C++ runtime
        # Flutter apps need these DLLs; shipping them next to the exe means no separate VC++ install.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & $iscc "/DAppVersion=$version" windows/installer/cabinet_crm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Branch builds: short-lived download (Actions storage is limited).
      - if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        # Test downloads only: a full storage quota must not fail the build.
        continue-on-error: true
        with:
          name: Casework-Windows-Setup
          path: app/build/installer/Casework-Setup-*.exe
          retention-days: 2
          compression-level: 0
      # Version tags (v1.0.0): attach to the GitHub Release (doesn't use Actions storage).
      - if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Casework ${{ env.RELEASE_TAG }}
          files: app/build/installer/Casework-Setup-*.exe
          generate_release_notes: true

  android:
    needs: [test, windows]
    # Every push, tag and release builds the phone apps; a hand-started run can skip them.
    if: github.event_name != 'workflow_dispatch' || inputs.phone_apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Release signing. Add these repository secrets once (README, "Signing the Android app"):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is signed with this runner's throwaway debug key, and phones
      # can't install it over a previous version.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No Android signing key in secrets: this APK is debug-signed and won't install over earlier versions."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PW:-$STORE_PW}"
          } > android/key.properties
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Casework-Android.apk
      - if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        # Test downloads only: a full storage quota must not fail the build.
        continue-on-error: true
        with:
          name: Casework-Android
          path: app/Casework-Android.apk
          retention-days: 2
          compression-level: 0
      - if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: app/Casework-Android.apk

  ios:
    needs: test
    # Every push, tag and release builds the phone apps; a hand-started run can skip them.
    if: github.event_name != 'workflow_dispatch' || inputs.phone_apps
    runs-on: macos-latest
    env:
      # TestFlight upload happens only for releases, and only once the Apple secrets exist
      # (README, "iPhone app: TestFlight").
      IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Unsigned build: proves the iPhone app compiles.
      - if: env.IOS_SIGNING != 'true' || env.RELEASE_TAG == ''
        run: flutter build ios --release --no-codesign

      - name: Install the distribution certificate and App Store profile
        if: env.IOS_SIGNING == 'true' && env.RELEASE_TAG != ''
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC"
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Sign the app target with that profile
        if: env.IOS_SIGNING == 'true' && env.RELEASE_TAG != ''
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 ios/ci_manual_signing.py ios/Runner.xcodeproj/project.pbxproj "$TEAM_ID" "$PROFILE_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.cabinetcrm.cabinetCrm</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      # Build numbers must always go up for TestFlight: use the workflow run number.
      - name: Build the signed iPhone app
        if: env.IOS_SIGNING == 'true' && env.RELEASE_TAG != ''
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: env.IOS_SIGNING == 'true' && env.RELEASE_TAG != ''
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove the signing keychain
        if: always() && env.IOS_SIGNING == 'true' && env.RELEASE_TAG != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
