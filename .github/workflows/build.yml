name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag, e.g. v1.0.0 (leave empty for a test build)"
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.47.9"
  # Release tag: a pushed v* tag, or the tag typed when starting the workflow by hand.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle Visual C++ runtime
        # Flutter apps need these DLLs; shipping them next to the exe means no separate VC++ install.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & $iscc "/DAppVersion=$version" windows/installer/cabinet_crm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Branch builds: short-lived download (Actions storage is limited).
      - if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Casework-Windows-Setup
          path: app/build/installer/Casework-Setup-*.exe
          retention-days: 5
          compression-level: 0
      # Version tags (v1.0.0): attach to the GitHub Release (doesn't use Actions storage).
      - if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Casework ${{ env.RELEASE_TAG }}
          files: app/build/installer/Casework-Setup-*.exe
          generate_release_notes: true

  android:
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Release signing. Add these repository secrets once (README, "Signing the Android app"):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is signed with this runner's throwaway debug key, and phones
      # can't install it over a previous version.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No Android signing key in secrets: this APK is debug-signed and won't install over earlier versions."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PW:-$STORE_PW}"
          } > android/key.properties
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Casework-Android.apk
      - if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Casework-Android
          path: app/Casework-Android.apk
          retention-days: 5
          compression-level: 0
      - if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: app/Casework-Android.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Unsigned build: proves the iOS app compiles (not uploaded: it can't be installed as-is).
      - run: flutter build ios --release --no-codesign

      # ---- TestFlight (later, needs an Apple Developer account, $99/yr) ----
      # Add these repository secrets, then replace the unsigned build with
      # `flutter build ipa --release --export-options-plist=ios/ExportOptions.plist`
      # and upload with `xcrun altool` / fastlane:
      #   APPLE_TEAM_ID                 - from developer.apple.com > Membership
      #   IOS_DIST_CERT_P12_BASE64      - Apple Distribution certificate (.p12), base64
      #   IOS_DIST_CERT_PASSWORD        - password of that .p12
      #   IOS_PROVISION_PROFILE_BASE64  - App Store provisioning profile for the bundle id, base64
      #   APP_STORE_CONNECT_KEY_ID      - App Store Connect API key id
      #   APP_STORE_CONNECT_ISSUER_ID   - API key issuer id
      #   APP_STORE_CONNECT_KEY_P8      - the .p8 key contents

