<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customers{% endblock %} · {{ settings.business_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">{{ settings.business_name }}</a>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('customers') }}">Customers</a>
    <a href="{{ url_for('projects') }}">Projects</a>
    <a href="{{ url_for('workflow') }}">Workflow</a>
    <a href="{{ url_for('settings_page') }}">Settings</a>
  </nav>
  <form class="search" action="{{ url_for('search') }}">
    <input name="q" placeholder="Search name, phone, J-/Q-/INV- number…" value="{{ request.args.get('q','') }}">
  </form>
  <a class="btn primary" href="{{ url_for('customer_form') }}">+ New customer</a>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
<script>
  // Confirm destructive forms
  document.querySelectorAll('form[data-confirm]').forEach(f =>
    f.addEventListener('submit', e => { if (!confirm(f.dataset.confirm)) e.preventDefault(); }));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
